name: Quarterly Coreboot Release

on:
  push:
    branches:
      - main
    paths:
      - 'blobs/**'
      - 'board/**'
      - 'configs/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/quarterly-release.yml'
  # Coreboot official releases target March, June, September, and December (YY.03/06/09/12).
  schedule:
    - cron: '0 6 15 3,6,9,12 *'
  workflow_dispatch:
    inputs:
      coreboot_ref:
        description: 'Coreboot git tag or commit SHA (leave blank for latest official YY.MM tag)'
        required: false
        default: ''
      release_tag:
        description: 'Release tag override (leave blank to derive v<coreboot_tag>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: coreboot/coreboot-sdk:2026-09-27_97eb3c4d52
      options: --user root
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      coreboot_ref: ${{ steps.meta.outputs.coreboot_ref }}
    steps:
      - name: Checkout board repository
        uses: actions/checkout@v4

      - name: Determine target Coreboot release tag
        id: meta
        run: |
          git config --global --add safe.directory "*"
          REF="${{ github.event.inputs.coreboot_ref }}"
          if [ -z "$REF" ]; then
            REF="$(git ls-remote --tags https://github.com/coreboot/coreboot.git \
              | grep -oE 'refs/tags/[0-9]{2}\.[0-9]{2}$' \
              | sed 's#refs/tags/##' \
              | sort -V \
              | tail -n 1)"
          fi
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${REF}"
          fi
          echo "coreboot_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target Coreboot ref=$REF, Release tag=$TAG"

      - name: Clone upstream Coreboot at target ref
        run: |
          git init coreboot
          cd coreboot
          git remote add origin https://github.com/coreboot/coreboot.git
          git fetch --depth 1 origin "${{ steps.meta.outputs.coreboot_ref }}"
          git checkout FETCH_HEAD
          git submodule update --init --checkout --depth 1 \
            3rdparty/intel-microcode \
            3rdparty/libgfxinit \
            3rdparty/libhwbase \
            3rdparty/vboot

      - name: Build ASRock H61M-S1 PLUS W25Q32 & W25Q64 ROMs
        env:
          COREBOOT_DIR: ${{ github.workspace }}/coreboot
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          OUT_DIR: ${{ github.workspace }}/release-out
        run: |
          bash scripts/build_all_roms.sh
          cp -f patches/0001-sandybridge-h61m-s1-plus-igd-raminit.patch release-out/
          cp -f patches/0002-edk2-delete-key-usb-boot-menu.patch release-out/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: h61m-s1-plus-release-assets
          path: release-out/*

  publish:
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: h61m-s1-plus-release-assets
          path: release-out

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ needs.build.outputs.release_tag }}
          CB_REF: ${{ needs.build.outputs.coreboot_ref }}
        run: |
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            echo "Release $REL_TAG already exists; skipping duplicate creation."
            exit 0
          fi
          python3 - <<'PY' > release-notes.md
          import os
          tag = os.environ["REL_TAG"]
          ref = os.environ["CB_REF"]
          print(f"""## ASRock H61M-S1 PLUS — Coreboot + EDK2 Release (`{tag}`)

          Automated quarterly Coreboot + EDK2 `UefiPayloadPkg` build tracking upstream Coreboot `{ref}`.

          ### Ready-to-Flash Full SPI ROM Images (Include Unlocked IFD, ME & Desktop VBT)
          - `h61m-s1-plus-coreboot-{tag}-w25q64-8mb-minimal-me-full.rom` (**8 MiB `W25Q64`, Recommended for External SPI**: `124 KiB` relocated `me_cleaner -S -r -t -d` ME + `AltMeDisable=1` + `7.875 MiB` BIOS)
          - `h61m-s1-plus-coreboot-{tag}-w25q64-8mb-mecleaned-compat-full.rom` (**8 MiB `W25Q64`, Internal `flashrom --ifd -i bios` Compatible**: `1532 KiB` `me_cleaner -S -d` ME + `6.5 MiB` BIOS at `0x180000`)
          - `h61m-s1-plus-coreboot-{tag}-w25q32-4mb-minimal-me-full.rom` (**4 MiB `W25Q32`, Minimal ME**: `124 KiB` relocated `me_cleaner -S -r -t -d` ME + `AltMeDisable=1` + `3.875 MiB` BIOS)
          - `h61m-s1-plus-coreboot-{tag}-w25q32-4mb-stock-me-full.rom` (**4 MiB `W25Q32`, Stock ME**: Stock ME `8.1.20.1336` + `2.5 MiB` LZMA BIOS at `0x180000`)

          ### Included Supporting Assets
          - Per-variant BIOS-region slices (`*-bios-region.bin`), `cbfs-layout-*.txt`, `*.defconfig`
          - `0001-sandybridge-h61m-s1-plus-igd-raminit.patch` & `0002-edk2-delete-key-usb-boot-menu.patch`
          - `SHA256SUMS.txt`

          See [`BLOBS.md`](BLOBS.md) and [`README.md`](README.md) for flashing instructions, hardware test logs, and disclaimers.""")
          PY
          gh release create "$REL_TAG" release-out/* \
            --title "ASRock H61M-S1 PLUS Coreboot ${REL_TAG} (upstream ${CB_REF})" \
            --notes-file release-notes.md
