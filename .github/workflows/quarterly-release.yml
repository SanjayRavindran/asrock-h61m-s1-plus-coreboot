name: Quarterly Coreboot Release

on:
  push:
    branches:
      - main
    paths:
      - 'blobs/**'
      - 'board/**'
      - 'configs/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/quarterly-release.yml'
  # Coreboot official releases target March, June, September, and December (YY.03/06/09/12).
  schedule:
    - cron: '0 6 15 3,6,9,12 *'
  workflow_dispatch:
    inputs:
      coreboot_ref:
        description: 'Coreboot git tag or commit SHA (leave blank for latest official YY.MM tag)'
        required: false
        default: ''
      release_tag:
        description: 'Release tag override (leave blank to derive v<coreboot_tag>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: coreboot/coreboot-sdk:2026-09-27_97eb3c4d52
      options: --user root
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      coreboot_ref: ${{ steps.meta.outputs.coreboot_ref }}
    steps:
      - name: Checkout board repository
        uses: actions/checkout@v6

      - name: Determine target Coreboot release tag
        id: meta
        run: |
          git config --global --add safe.directory "*"
          REF="${{ github.event.inputs.coreboot_ref }}"
          if [ -z "$REF" ]; then
            REF="$(git ls-remote --tags https://github.com/coreboot/coreboot.git \
              | grep -oE 'refs/tags/[0-9]{2}\.[0-9]{2}$' \
              | sed 's#refs/tags/##' \
              | sort -V \
              | tail -n 1)"
          fi
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${REF}"
          fi
          echo "coreboot_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target Coreboot ref=$REF, Release tag=$TAG"

      - name: Clone upstream Coreboot at target ref
        run: |
          git init coreboot
          cd coreboot
          git remote add origin https://github.com/coreboot/coreboot.git
          git fetch --depth 1 origin "${{ steps.meta.outputs.coreboot_ref }}"
          git checkout FETCH_HEAD
          git submodule update --init --checkout --depth 1 \
            3rdparty/intel-microcode \
            3rdparty/libgfxinit \
            3rdparty/libhwbase \
            3rdparty/vboot

      - name: Build ASRock H61M-S1 PLUS W25Q32 & W25Q64 ROMs
        env:
          COREBOOT_DIR: ${{ github.workspace }}/coreboot
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          OUT_DIR: ${{ github.workspace }}/release-out
        run: |
          bash scripts/build_all_roms.sh
          cp -f patches/0001-sandybridge-h61m-s1-plus-igd-raminit.patch release-out/
          cp -f patches/0002-edk2-delete-key-usb-boot-menu.patch release-out/
          cp -f patches/0003-edk2-cf9-reset-and-secureboot-components.patch release-out/
          cp -f patches/0004-edk2-cbfs-ipxe-support.patch release-out/
          cp -f configs/asrock-h61m-s1-plus-sensors.conf release-out/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: h61m-s1-plus-release-assets
          path: release-out/*

  publish:
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          name: h61m-s1-plus-release-assets
          path: release-out

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ needs.build.outputs.release_tag }}
          CB_REF: ${{ needs.build.outputs.coreboot_ref }}
        run: |
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            echo "Release $REL_TAG already exists; skipping duplicate creation."
            exit 0
          fi
          python3 - <<'PY' > release-notes.md
          import os, textwrap
          tag = os.environ["REL_TAG"]
          ref = os.environ["CB_REF"]
          print(textwrap.dedent(f"""\
          ## ASRock H61M-S1 PLUS — Coreboot + EDK2 + iPXE Release (`{tag}`)

          Automated Coreboot + EDK2 `UefiPayloadPkg` + **iPXE Network Boot** build tracking upstream Coreboot `{ref}`.

          ### Ready-to-Flash Full SPI ROM Images (4 MiB `W25Q32` & 8 MiB `W25Q64`, With & Without/Minimal ME)
          - `h61m-s1-plus-coreboot-{tag}-w25q64-8mb-minimal-me-full.rom` (**8 MiB `W25Q64`, Minimal/Disabled ME — Recommended for External SPI**: `124 KiB` relocated `me_cleaner -S -r -t -d` ME + `AltMeDisable=1` + `7.875 MiB` BIOS + full `ipxe.efi`)
          - `h61m-s1-plus-coreboot-{tag}-w25q64-8mb-mecleaned-compat-full.rom` (**8 MiB `W25Q64`, With ME — Internal `flashrom --ifd -i bios` Compatible**: `1532 KiB` `me_cleaner -S -d` ME + `6.5 MiB` BIOS at `0x180000` + full `ipxe.efi`)
          - `h61m-s1-plus-coreboot-{tag}-w25q32-4mb-minimal-me-full.rom` (**4 MiB `W25Q32`, Minimal/Disabled ME**: `124 KiB` relocated `me_cleaner -S -r -t -d` ME + `AltMeDisable=1` + `3.875 MiB` BIOS + full `ipxe.efi`)
          - `h61m-s1-plus-coreboot-{tag}-w25q32-4mb-stock-me-full.rom` (**4 MiB `W25Q32`, With Stock ME**: Stock ME `8.1.20.1336` + `2.5 MiB` LZMA BIOS at `0x180000` + targeted `realtek--intel--intelx--snp` `ipxe.efi`)

          ### Highlights & iPXE Integration
          - **Built-in iPXE UEFI Network Boot (`efi/ipxe.efi`)**: Loaded from CBFS via EDK2 `CbfsPayloadAssetsDxe` (`patches/0004-edk2-cbfs-ipxe-support.patch`) and registered as **`iPXE Network Boot`** in UEFI Boot Manager (`HTTPS`, `HTTP`, `TFTP`, `iSCSI`, `imgverify`/`imgtrust`, `ping`, `nslookup`, `ntp`, `cert`; `CONSOLE_EFI` without duplicate `CONSOLE_SERIAL` output). Full driver build on `8 MiB` + `4 MiB` minimal-ME ROMs; targeted `realtek--intel--intelx--snp.efi` (Realtek `RTL8111/8168` + Intel `I226-V`/Intel NICs + UEFI SNP) on `4 MiB` stock-ME.
          - **Delete-Key USB Boot Menu, GRUB `fwsetup` CF9 Reset, Secure Boot & NVMe DXE, `NCT6776F` `PECI0` SmartFan IV & `lm-sensors`**.

          ### Included Supporting Assets
          - Per-variant BIOS-region slices (`*-bios-region.bin`), `cbfs-layout-*.txt`, `*.defconfig`
          - `0001-sandybridge-h61m-s1-plus-igd-raminit.patch`, `0002-edk2-delete-key-usb-boot-menu.patch`, `0003-edk2-cf9-reset-and-secureboot-components.patch`, & `0004-edk2-cbfs-ipxe-support.patch`
          - `asrock-h61m-s1-plus-sensors.conf`
          - `SHA256SUMS.txt`

          See [`BLOBS.md`](BLOBS.md) and [`README.md`](README.md) for flashing instructions, hardware test logs, and disclaimers."""))
          PY
          gh release create "$REL_TAG" release-out/* \
            --title "ASRock H61M-S1 PLUS Coreboot + EDK2 + iPXE ${REL_TAG} (upstream ${CB_REF})" \
            --notes-file release-notes.md
