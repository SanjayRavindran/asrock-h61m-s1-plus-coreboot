# SPDX-License-Identifier: GPL-2.0-only
# lm-sensors configuration for ASRock H61M-S1 PLUS (H61M-VS4 G/A 1.00) + Coreboot >= v26.11.5
# Install: sudo install -m 0644 configs/asrock-h61m-s1-plus-sensors.conf /etc/sensors.d/asrock-h61m-s1-plus.conf
# Apply limits: sudo sensors -s

chip "nct6776-*"

    # --- Analog Voltages (U1007 NCT6776F + ASRock PE2/boardview scaling) ---
    label in0 "Vcore"
    set in0_min 0.40
    set in0_max 1.60

    # Pin 105 (VIN0): +12VIN_HM divider (OR638/OR160). Stock ASRock PE2 uses 528/10 = 6.6
    # (56 kOhm / 10 kOhm datasheet divider). Live H61M-S1 PLUS boards typically read ~1.61-1.62 V raw
    # (~10.6-10.7 V at 6.6x); adjust compute factor only if a multimeter on ATX +12V differs.
    label in1 "+12V"
    compute in1 @ * 6.6, @ / 6.6
    set in1_min 10.0
    set in1_max 13.2

    label in2 "AVCC"
    set in2_min 3.3 * 0.90
    set in2_max 3.3 * 1.10

    label in3 "+3.3V"
    set in3_min 3.3 * 0.90
    set in3_max 3.3 * 1.10

    # Pin 104 (VIN1): SIO_IMON routed via AR8491 to UP701 (RT8876 IMON current-sense), not a power rail
    ignore in4

    # Pin 103 (VIN2): +5VIN_HM divider (OR374/OR375 = 20 kOhm / 10 kOhm); matches stock ASRock PE2 (240/10 = 3.0)
    label in5 "+5V"
    compute in5 @ * 3, @ / 3
    set in5_min 5.0 * 0.90
    set in5_max 5.0 * 1.10

    # Pin 109 (VIN3/AUXTIN): shorted to MB_TEMP thermistor divider (OR690/TRMB8), not a power rail
    ignore in6

    label in7 "3VSB"
    set in7_min 3.3 * 0.90
    set in7_max 3.3 * 1.10

    label in8 "Vbat"
    set in8_min 2.40
    set in8_max 3.60

    # --- Fan Speeds & PWM ---
    label fan1 "CHA_FAN1"
    label fan2 "CPU_FAN1"
    # AUXFANIN0..2 (U1007 pins 3-5) and AUXFANOUT are unpopulated on PCB
    ignore fan3
    ignore fan4
    ignore fan5
    ignore pwm3

    # --- Temperatures (Coreboot v26.11.5 SMIOVT1=SYSTIN, SMIOVT2=PECI Agent 0) ---
    # temp1 = SYSTIN (Pin 111 MB_TEMP 10k beta=3435K thermistor TRMB8)
    label temp1 "M/B Temp"
    set temp1_max 75
    set temp1_max_hyst 70

    # temp7 = PECI Agent 0 (Pin 115 SIO_PECI, 0.5 C resolution, TjMax=105 C crit)
    label temp7 "CPU Temp (PECI)"
    set temp7_max 85
    set temp7_max_hyst 80

    # U1007 pins 75/76 MSCL/MSDA are unconnected on H61M-S1 PLUS (always 0.0 C)
    ignore temp8
    ignore temp9
    ignore temp10

    # --- Chassis Intrusion ---
    # Pin 100 CASEOPEN0# is pulled low by Q11/OR4 whenever CI1 pins 1-2 have no jumper/switch;
    # comment out 'ignore intrusion0' if a physical chassis switch or CI1 jumper is installed.
    ignore intrusion0
    # Pin 72 CASEOPEN1# is unconnected on PCB
    ignore intrusion1
